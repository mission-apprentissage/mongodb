---
- hosts: all
  become: true
  gather_facts: true
  tasks:

    - name: "Chargement des variables chiffrées globales"
      community.sops.load_vars:
        file: "{{ inventory_dir }}/../env.global.yml"
        expressions: ignore

    - name: "Chargement des variables chiffrées de l'environnement {{ env_type }}"
      community.sops.load_vars:
        file: "{{ inventory_dir }}/../env.{{ env_type }}.yml"
        expressions: ignore

    - name: "Installation de MongoDB"
      include_tasks: ./tasks/install_mongodb.yml

    - name: "Montage du volume 'MONGO_DATA'"
      include_tasks: ./tasks/mount_volume.yml

    - name: "Copie des fichiers"
      include_tasks: ./tasks/files_copy.yml

    - name: "Lancement des services système"
      include_tasks: ./tasks/system.yml

    - name: "Installation d'une autorité de certification X.509 intermédiaire"
      include_tasks: ./tasks/install_ca.yml

    - name: "Installation des certificats X.509 pour MongoDB"
      include_tasks: ./tasks/install_tls.yml

    - name: "Configuration de MongoDB"
      include_tasks: ./tasks/start_mongodb.yml

    - name: "Configuration de la réplication"
      include_tasks: ./tasks/config_replicat_set.yml
      when: context == "new-cluster"

    - name: "Ajout du membre à la grappe"
      ansible.builtin.shell:
        cmd: "/opt/app/scripts/register_member.sh"
      when: context == "new-member"

    - name: "Configuration des utilisateurs"
      include_tasks: ./tasks/create_users.yml
      when: context == "new-cluster" or context == "update"

    - name: "Installation de MongoDB Search"
      include_tasks: ./tasks/install_mongot.yml
      when: mongot_enable | default(false) | bool

    - name: "Configuration de la sauvegarde de la base de données"
      import_tasks: ./tasks/configure-mongodb-backup.yml
      when: backup_enable | default(false) | bool

    - name: "Installation de l'agent Percona"
      include_tasks: ./tasks/percona.yml

    - name: "Vérification de la nécessité d'un redémarrage du serveur"
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: "Un redémarrage du serveur est nécessaire"
      reboot:
      when: reboot_required_file.stat.exists == true

  handlers:
    - name: "Mise à jour de la configuration Systemd"
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: "Redémarrage du service MongoDB"
      ansible.builtin.service:
        name: mongod
        state: restarted
        enabled: yes

    - name: "Redémarrage du service MongoDB Search"
      ansible.builtin.service:
        name: mongot
        state: restarted
        enabled: yes

    - name: "Redémarrage du service THP"
      ansible.builtin.service:
        name: disable-transparent-huge-pages
        state: restarted
        enabled: yes

    - name: "Redémarrage du service logrotate"
      ansible.builtin.service:
        name: logrotate
        enabled: true
        state: restarted
